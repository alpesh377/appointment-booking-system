services:
  db:
    image: postgres:16-alpine
    container_name: abs-postgres
    environment:
      POSTGRES_USER: abs
      POSTGRES_PASSWORD: abs
      POSTGRES_DB: appointment_booking
    ports:
      - "5432:5432"
    volumes:
      - abs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abs -d appointment_booking"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  abs_pgdata:
